<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Encryption Web App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-2" id="appTitle">Age Encryption Web App</h1>
      <div
        id="keyFingerprint"
        class="mb-4"
        style="font-size: 2rem; letter-spacing: 0.1em; opacity: 0.35"
        title="Recipient key fingerprint"
      >
        ◌◌◌◌
      </div>

      <div class="mb-3">
        <label for="recipientInput" class="form-label"
          >Recipient Keys (one per line)</label
        >
        <textarea
          class="form-control"
          id="recipientInput"
          rows="2"
          placeholder="Enter recipient keys"
        ></textarea>
        <p class="form-text">
          Tip: You can pre-fill the recipient using a URL like #to=age1... and
          set a custom heading with #label=My%20Team
        </p>
      </div>

      <div class="mb-3">
        <label for="messageInput" class="form-label">Message to Encrypt</label>
        <textarea
          class="form-control"
          id="messageInput"
          rows="5"
          placeholder="Enter your message here"
        ></textarea>
      </div>

      <button id="encryptButton" class="btn btn-primary mb-3">Encrypt</button>

      <div class="mb-3">
        <label for="encryptedOutput" class="form-label"
          >Encrypted Message</label
        >
        <textarea
          class="form-control"
          id="encryptedOutput"
          rows="5"
          readonly
        ></textarea>
      </div>

      <button id="copyButton" class="btn btn-secondary mb-3">
        Copy to Clipboard
      </button>

      <p class="text-muted">
        Source code available on
        <a href="https://github.com/funrun11/age-webapp" target="_blank"
          >GitHub</a
        >
        (forked from
        <a href="https://github.com/dtinth/age-webapp" target="_blank"
          >dtinth/age-webapp</a
        >)
      </p>
    </div>

    <script type="module">
      import buffer from "https://cdn.jsdelivr.net/npm/safe-buffer/+esm";
      Object.assign(globalThis, { Buffer: buffer.Buffer });

      import {
        WASI,
        init,
      } from "https://cdn.jsdelivr.net/npm/@wasmer/wasi@1.2.2/dist/Library.esm.js";

      // 256 visually distinct emoji: 4 of them encode 32 bits of the key hash.
      const FINGERPRINT_EMOJI = [
        ..."🐶🐱🐭🐹🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐔🐧🐦🐤🦆🦅🦉🦇🐺🐗🐴🦄🐝🐛🦋🐌🐞",
        ..."🐜🦂🐢🐍🦎🐙🦑🦐🦀🐡🐠🐬🐳🦈🐊🐆🐘🦏🐪🦒🦘🦌🦓🦍🐓🦃🦜🐇🐑🐖🦔🦚",
        ..."🌵🌲🌳🌴🌱🌿🍀🎍🍃🍄🌰🌹🌻🌼🌷🌸💐🍇🍈🍉🍊🍋🍌🍍🥭🍎🍐🍑🍒🍓🥝🍅",
        ..."🥥🥑🍆🥔🥕🌽🥒🥦🧄🧅🥜🌾🍞🥐🥨🧀🍖🍗🍔🍟🍕🌭🌮🌯🥗🍿🥚🍳🥞🍦🍩🍪",
        ..."⌚📱💻📼📀💽💾💿📷📸📹🎥📞📟📠📺📻🧭⏰⌛⏳📡🔋🔌💡🔦🧯💸💵💎🧰🔧",
        ..."🔨🔩🧲🔫💣🔪🚬🏺🔮🧿🧸🎈🎉🎁🎀🔑🔐🔒📌📎📏📐📕📗📘📙📚📒📝📓📔📰",
        ..."🚀🛸🚁🚂🚃🚌🚑🚒🚓🚕🚗🚚🚜🚲🛴⛵🚤⚓🚧⛽🗿🗽🏰🏯🎡🎢🎠⛲🌋🗻⛺🌁",
        ..."🌉🎑🌃🌌🌠🌟🌙⛅⛈⛄🔥💧🌊🌈🚦🚥🔔🥁🎷🎻🏀⚽🏈🎾🎱🏓🥊🏆🥇🎯🎲🎮",
      ];

      // Trubetskoy's "20 simple, distinct colors" (first 12), with red, blue,
      // purple and teal lightened and lavender swapped for mint so every step
      // clears 4.5:1 on the dark surface. https://sashamaps.net/docs/resources/20-colors/
      const LABEL_COLORS = [
        "#ff4d6d", // red
        "#3cb44b", // green
        "#ffe119", // yellow
        "#7b93ff", // blue
        "#f58231", // orange
        "#c77dff", // purple
        "#46f0f0", // cyan
        "#f032e6", // magenta
        "#bcf60c", // lime
        "#fabebe", // pink
        "#22b8b8", // teal
        "#aaffc3", // mint
      ];

      function normalizeRecipients(text) {
        return [
          ...new Set(
            text
              .split("\n")
              .map((line) => line.trim())
              .filter((line) => !!line),
          ),
        ].sort();
      }

      async function sha256(input) {
        const bytes =
          typeof input === "string" ? new TextEncoder().encode(input) : input;
        return new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
      }

      async function fingerprintOf(recipients) {
        if (!recipients.length) return null;
        const digest = await sha256(recipients.join("\n"));
        return [...digest.slice(0, 4)]
          .map((byte) => FINGERPRINT_EMOJI[byte])
          .join("");
      }

      // Colour is keyed on the hash of the keys *and* the hash of the label, so
      // the same keys under a different label read as a different pairing.
      async function labelColorOf(recipients, label) {
        if (!recipients.length) return null;
        const keysHash = await sha256(recipients.join("\n"));
        const labelHash = await sha256(label);
        const digest = await sha256(
          new Uint8Array([...keysHash, ...labelHash]),
        );
        return LABEL_COLORS[
          (((digest[0] << 8) | digest[1]) >>> 0) % LABEL_COLORS.length
        ];
      }

      let fingerprintSeq = 0;
      async function updateFingerprint() {
        const seq = ++fingerprintSeq;
        const el = document.getElementById("keyFingerprint");
        const titleEl = document.getElementById("appTitle");
        const recipients = normalizeRecipients(
          document.getElementById("recipientInput").value,
        );
        let emoji = null;
        let color = null;
        try {
          [emoji, color] = await Promise.all([
            fingerprintOf(recipients),
            labelColorOf(recipients, titleEl.textContent),
          ]);
        } catch {
          // crypto.subtle is unavailable (insecure context) — keep the placeholder
        }
        if (seq !== fingerprintSeq) return;
        titleEl.style.color = color ?? "";
        el.textContent = emoji ?? "◌◌◌◌";
        el.style.opacity = emoji ? "1" : "0.35";
        el.title = emoji
          ? `Fingerprint of ${recipients.length} recipient key${
              recipients.length === 1 ? "" : "s"
            }`
          : "Recipient key fingerprint";
      }

      document
        .getElementById("recipientInput")
        .addEventListener("input", updateFingerprint);

      function parseHashParams() {
        const hash = window.location.hash.substr(1);
        return Object.fromEntries(new URLSearchParams(hash));
      }

      function updateRecipientFromHash() {
        const params = parseHashParams();
        const recipientInput = document.getElementById("recipientInput");
        if (params.to && params.to !== recipientInput.dataset.lastTo) {
          recipientInput.value = params.to.split(",").join("\n");
          recipientInput.dataset.lastTo = params.to;
        }
      }

      const DEFAULT_TITLE = document.getElementById("appTitle").textContent;

      function updateTitleFromHash() {
        const label = (parseHashParams().label ?? "").trim();
        // textContent, never innerHTML: the label comes from the URL
        document.getElementById("appTitle").textContent = label || DEFAULT_TITLE;
      }

      function updateFromHash() {
        updateTitleFromHash(); // before updateFingerprint: the colour hashes it
        updateRecipientFromHash();
        updateFingerprint();
      }

      updateFromHash();
      window.addEventListener("hashchange", updateFromHash);

      await init();

      const modulePromise = (async () => {
        const moduleBytes = await fetch("vendor/age-1.2.0.wasm");
        const module = await WebAssembly.compileStreaming(moduleBytes);
        return module;
      })();

      async function encrypt(text, recipients) {
        const wasi = new WASI({
          args: [
            "age",
            "--armor",
            ...recipients.flatMap((recipient) => ["--recipient", recipient]),
          ],
          env: {},
        });
        wasi.setStdinString(text);
        await wasi.instantiate(await modulePromise, {});
        const exitCode = wasi.start();
        const stdout = wasi.getStdoutString();
        const stderr = wasi.getStderrString();
        return { stdout, stderr, exitCode };
      }

      document
        .getElementById("encryptButton")
        .addEventListener("click", async () => {
          const recipientInput =
            document.getElementById("recipientInput").value;
          const messageInput = document.getElementById("messageInput").value;
          const encryptedOutput = document.getElementById("encryptedOutput");
          encryptedOutput.disabled = true;
          try {
            const recipients = recipientInput
              .split("\n")
              .map((line) => line.trim())
              .filter((line) => !!line);

            try {
              encryptedOutput.value = "Encrypting...";
              const result = await encrypt(messageInput, recipients);
              if (result.exitCode === 0) {
                encryptedOutput.value = result.stdout;
              } else {
                encryptedOutput.value =
                  `Error: ${result.stderr}\nExit code: ${result.exitCode}`;
              }
            } catch (error) {
              encryptedOutput.value = `Error: ${error.message}`;
            }
          } finally {
            encryptedOutput.disabled = false;
          }
        });

      document.getElementById("copyButton").addEventListener("click", () => {
        const encryptedOutput = document.getElementById("encryptedOutput");
        encryptedOutput.select();
        document.execCommand("copy");
      });

      Object.assign(globalThis, { encrypt });
    </script>
  </body>
</html>
